services:
  # 静态 Web 应用：宿主端口由 WEB_PORT 覆盖（默认 8080）
  web:
    build: .
    image: safe-zone-checker-web
    ports:
      - "${WEB_PORT:-8080}:80"

  # 一次性验收：跑完全部单元测试与端到端测试后退出，退出码即验收结论
  verify:
    build:
      context: .
      dockerfile: Dockerfile.verify
    image: safe-zone-checker-verify
    depends_on:
      - web
    environment:
      BASE_URL: http://web:80
      CI: "1"
